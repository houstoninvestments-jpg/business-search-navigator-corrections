# Manual only. Makes sure the "correction" label used by the report form exists.
name: Ensure labels

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create or update the correction label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create correction --repo "$REPO" --color D93F0B \
            --description "Report of a wrong, broken, or outdated link or fact" --force
          gh label list --repo "$REPO" --search correction
